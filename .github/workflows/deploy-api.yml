name: Deploy API to Elastic Beanstalk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment zip package
        working-directory: apps/api
        run: zip -r ../../deploy-api.zip src package.json Procfile .platform

      - name: Deploy to AWS Elastic Beanstalk
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: brightloop-api
          environment_name: brightloop-api-prod
          version_label: ${{ github.sha }}
          region: ap-south-1
          deployment_package: deploy-api.zip
          wait_for_deployment: true
