name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }\""
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: apps/api
        run: npm install
      - name: Run Must-Pass Checks
        working-directory: apps/api
        env:
          NODE_ENV: development
          MONGODB_URI: mongodb://localhost:27017/brightloop_test?directConnection=true
          JWT_SECRET: test-secret-key-2026
          EMAIL_PROVIDER: console
        run: npm test
